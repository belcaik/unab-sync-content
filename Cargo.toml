[package]
name = "u_crawler"
version = "0.1.0"
edition = "2021"

[lints.clippy]
# Matches the CI gate, so a local `cargo clippy` fails on the same things.
too_many_arguments = "deny"
needless_collect = "deny"
redundant_clone = "deny"
large_enum_variant = "deny"

[features]
default = ["zoom"]
# Gates the headless browser and the whole Zoom flow (session capture, SSO,
# recording listing/download). `chromiumoxide` is a git-pinned dependency —
# resolving it needs network+git and it is the fragile corner of the build
# matrix against the musl target. The calendar-sync flow never touches any of
# this, so building without it needs neither the browser nor git.
zoom = [
    "dep:chromiumoxide",
    "dep:rusqlite",
    "dep:reqwest_cookie_store",
    "dep:cookie",
    "dep:cookie_store",
    "dep:base64",
    "dep:futures",
]

[dependencies]
tokio = { version = "1.39", features = ["fs", "macros", "rt-multi-thread", "process"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "deflate", "stream", "rustls-tls", "cookies"] }
serde_json = "1.0"
url = "2.5"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
indicatif = { version = "0.17", features = ["tokio"] }
sanitize-filename = "0.5"
html2md = "0.2"
deunicode = "1.6"
sha1 = "0.10"
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
urlencoding = "2.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
base64 = { version = "0.22", optional = true }
# Pinned: chromiumoxide has no crates.io release with the CDP Fetch APIs this uses.
# Without a rev, `cargo update` would float browser-automation code to an arbitrary commit.
# Optional: gated behind the `zoom` feature (see [features] above) so a build
# without it never needs network+git to resolve this dependency.
chromiumoxide = { git = "https://github.com/mattsse/chromiumoxide", rev = "6f2392f78ae851e2acf33df8e9764cc299d837db", features = ["tokio-runtime"], optional = true }
futures = { version = "0.3", optional = true }
reqwest_cookie_store = { version = "0.9.0", optional = true }
cookie = { version = "0.18.1", optional = true }
cookie_store = { version = "0.22.0", optional = true }

[dev-dependencies]
tempfile = "3.23.0"
http = "1"
