download_root = "<your download root>"
concurrency = 4
max_rps = 2
user_agent = ""

[logging]
level = "info"
file = "<your log file>"

[canvas]
base_url = "<https://canvas.yourinstitution.domain>"
token = "<your token>"
token_cmd = ""                  # alternative to `token`: a command that prints the token
ignored_courses = [""]          # course ids to skip

# Institutional SSO credentials, used by the Zoom flow to log in headlessly.
# SECURITY: these are stored in cleartext. Prefer leaving sso_password empty and
# supplying it out of band if your threat model does not allow that.
sso_email = "<your email>"
sso_password = "<your password>"

[announcements]
enabled = true                  # sync course announcements as markdown
download_media = true           # also download Canvas-hosted attachments and inline media

[calendar]
enabled = true                   # set false to skip the calendar-sync flow
caldir_root = "~/Documents/Caldir"  # root of the caldir tree u_crawler owns exclusively

[layout]
# How course directories are named (layout v2). Everything becomes lowercase
# kebab-case ASCII. `course_dir` takes the placeholders {code}, {name} and {id}.
# Set this BEFORE the first run of the new version: a layout v1 library is
# migrated (renamed in place) by the first sync, announcements, calendar or
# zoom flow, with these names. Afterwards a course keeps its directory even if
# you change the template; only new courses use the new one. Preview with
# `u_crawler migrate --dry-run`.
course_dir = "{code}-{name}"
code_pattern = ""               # regex on course_code; group 1 (or the match) fills {code}
name_strip_pattern = ""         # regex; every match is removed from the name before {name}
section_pattern = ""            # regex finding the section/NRC (in the code, then the name); only
                                # used to add -s<nrc> when a course would get a directory name
                                # that another course has, or already had, in this library
term_pattern = ""               # regex finding the academic term (in the code, then the name);
                                # group 1 (or the match) is curso.json's "term"
#
# Example (UNAB): code "ATDF105_202615_2690_EL_ON" + name "202615_2690_MINERIA DE DATOS"
# become "atdf105-mineria-de-datos"; two sections of ATDF106 become
# "atdf106-...-s2520" and "atdf106-...-s2524". The indexes and curso.json show
# the name stripped and humanized ("Mineria de Datos"), term "202615", section "2690".
# code_pattern = '^([A-Z]+[0-9]+)'
# name_strip_pattern = '^[0-9]{6}[_\s]+[0-9]+[_\s]+'
# section_pattern = '(?:^|_)[0-9]{6}[_\s]+([0-9]+)[_\s]'
# term_pattern = '(?:^|_)([0-9]{6})[_\s]'

[zoom]
enabled = true                  # set false to skip the Zoom subsystem entirely
ffmpeg_path = "ffmpeg"          # or a full path if not on $PATH
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36 Edg/140.0.0.0"
external_tool_id = 187
